name: CI/CD - Horus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate static application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate HTML, configuration and scoring rubric
        run: python scripts/validate_site.py
      - name: Package static application
        run: |
          mkdir -p _site/config
          cp index.html app.js _site/
          cp config/rules.yaml config/excel-check.yaml config/docx-check.csv _site/config/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll
          python scripts/validate_site.py _site
      - name: Upload validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
